name: "openenv-fairaudit"
version: "1.0.0"
spec_version: "1"

client:
  class_name: "FairAuditEnv"
  module: "client"

action:
  class_name: "BiasAuditAction"
  module: "server.models"

observation:
  class_name: "BiasAuditObservation"
  module: "server.models"

tasks:
  - id: "dataset-scan"
    name: "Dataset Scan"
    description: "Scan raw loan applicant data to identify hidden proxy variables correlating with protected attributes."
    difficulty: "easy"

  - id: "model-audit"
    name: "Model Audit"
    description: "Evaluate a pre-trained baseline loan approval model, compute Disparate Impact, and flag compliance violations."
    difficulty: "medium"

  - id: "bias-mitigation"
    name: "Bias Mitigation"
    description: "Apply algorithmic mitigations to the biased model while navigating the Pareto Trap to avoid catastrophic accuracy loss."
    difficulty: "hard"