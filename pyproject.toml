[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairaudit-env"
version = "1.0.0"
description = "An environment to audit and mitigate bias in predictive models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core==0.2.3",
    "fastapi",
    "uvicorn",
    "pydantic",
    "scikit-learn==1.3.1",
    "pandas==2.1.1",
    "numpy==1.26.0",
    "fairlearn==0.10.0",
    "openai",
    "python-dotenv"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["server"]
py-modules = ["client", "inference"]